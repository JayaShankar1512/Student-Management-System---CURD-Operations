<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
  </head>
  <body>
    <div class="container">
      <h3 class="text-center py-2">Please Enter Student Data Here</h3>
      <style media="screen">
        input[name]{
          margin-top: 4px;
        }
      </style>
      <div class="row">
        <div class="offset-md-3 col-md-6">
          <form method="POST" class="shadow-lg">
            {% csrf_token %}

            <input type="text" name="fname" class="form-control" placeholder="First Name" value="{{student.first_name}}">

            <input type="text" name="lname" class="form-control" placeholder="Last Name" value="{{student.last_name}}">

            <input type="text" name="course" class="form-control" placeholder="Course" value="{{student.course}}">

            <input type="number" name="fee" class="form-control" placeholder="Fee" value="{{student.fee}}">

            <input type="number" name="a1" class="form-control" placeholder="Assignment1 Marks" value="{{student.assignment1}}">

            <input type="number" name="a2" class="form-control" placeholder="Assignment2 Marks" value="{{student.assignment2}}">

            <input type="number" name="a3" class="form-control" placeholder="Assignment3 Marks" value="{{student.assignment3}}">

            <input type="number" name="a4" class="form-control" placeholder="Assignment4 Marks" value="{{student.assignment4}}">

            <input type="text" name="institute" class="form-control" placeholder="Institute Name" value="{{student.institute}}">

            <input type="text" name="location" class="form-control" placeholder="Location" value="{{student.location}}">
            <center>
              <input type="submit" value="Update" class="btn btn-outline-success">
              <input type="reset" value="Clear" class="btn btn-outline-danger">
            </center>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
